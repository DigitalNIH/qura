<style>
/* Locked cover: the case file's masthead and one quiet form, in the same paper-and-ink palette */
:root { --bg: #ececee; --white: #ffffff; --ink: #0b0b0e; --ink-2: #55565e; --ink-3: #95969f; --rule: #d2d3d9; --coral: #ff5a1f; --coral-ink: #d4420e; --blue: #2a63f5;
  --f-display: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif; --f-serif: "Instrument Serif", Georgia, serif; --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0c0c0f; --white: #1b1b21; --ink: #f1f1f3; --ink-2: #a8a9b1; --ink-3: #6b6c75; --rule: #26272e; --coral: #ff6a33; --coral-ink: #ff7a4a; --blue: #5b8cff; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-display); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); }
.mast { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; max-width: 1200px; width: 100%; margin: 0 auto; }
.mast span { border-top: 1px solid var(--ink); padding-top: 6px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mast .b { color: var(--ink); } .mast .b::before { content: "\25CF  "; color: var(--coral); }
main { flex: 1; display: grid; place-items: center; padding-block: 48px; }
.gate { width: min(440px, 100%); display: grid; gap: 18px; }
.kicker { margin: 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--coral-ink); }
h1 { margin: 0; font-size: clamp(36px, 7vw, 56px); line-height: 0.95; letter-spacing: -0.04em; font-weight: 500; font-stretch: 90%; text-wrap: balance; }
h1 i { font-family: var(--f-serif); font-weight: 400; letter-spacing: -0.02em; }
p.note { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.45; }
form { display: grid; gap: 10px; margin-top: 6px; }
label { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.row { display: flex; gap: 8px; }
input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--white); border: 1px solid var(--rule); border-radius: 999px; padding: 12px 18px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
button { font: inherit; font-size: 15px; font-weight: 600; border: 0; border-radius: 999px; padding: 12px 22px; background: var(--ink); color: var(--bg); cursor: pointer; }
button[disabled] { opacity: 0.6; cursor: default; }
.err { min-height: 20px; margin: 0; font-size: 14px; color: var(--coral-ink); }
footer { max-width: 1200px; width: 100%; margin: 0 auto; border-top: 1px solid var(--rule); padding-top: 10px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.03em; }
</style>
</head>
